version: '3.8'

services:
  3x-ui:
    image: bigbugcc/3x-ui:latest
    container_name: 3x-ui
    restart: unless-stopped
    network_mode: host
    environment:
      - XRAY_VMESS_AEAD_FORCED=false
    volumes:
      - ./db/:/etc/x-ui/
      - ./cert/:/root/cert/
    stdin_open: true
    tty: true
